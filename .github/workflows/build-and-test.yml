name: Build and Test

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'site/**'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'site/**'
  workflow_dispatch:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore Ambystech.Elaris.sln

    # Builds the library, the plugins package, the tests and every example,
    # so API changes that break an example (or the README quickstart, which
    # mirrors the HelloWorld example) fail the build.
    - name: Build
      run: dotnet build Ambystech.Elaris.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test tests/Ambystech.Elaris.UI.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --logger "html;LogFileName=test-results.html"

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: |
          **/test-results.trx
          **/test-results.html
