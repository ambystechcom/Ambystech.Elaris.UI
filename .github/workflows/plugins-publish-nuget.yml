name: Publish Plugins to NuGet

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'src/**'
      - 'tests/**'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.modified, '.github/workflows/')"
    outputs:
      version: ${{ steps.gitversion.outputs.semVer }}
      nuget_version: ${{ steps.gitversion.outputs.nuGetVersionV2 }}
      is_prerelease: ${{ contains(steps.gitversion.outputs.nuGetVersionV2, '-') }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v1.1.1
      with:
        versionSpec: '5.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v1.1.1
      with:
        useConfigFile: true
        configFilePath: GitVersion.yml

    - name: Display calculated version
      run: |
        echo "Version: ${{ steps.gitversion.outputs.semVer }}"
        echo "NuGetVersion: ${{ steps.gitversion.outputs.nuGetVersionV2 }}"

    - name: Update csproj version
      run: |
        sed -i 's/<Version>.*<\/Version>/<Version>${{ steps.gitversion.outputs.nuGetVersionV2 }}<\/Version>/' packages/plugins/Ambystech.Elaris.UI.CodeEditor.Plugins/Ambystech.Elaris.UI.CodeEditor.Plugins.csproj

    - name: Restore dependencies
      run: dotnet restore packages/plugins/Ambystech.Elaris.UI.CodeEditor.Plugins/Ambystech.Elaris.UI.CodeEditor.Plugins.csproj

    - name: Build
      run: dotnet build packages/plugins/Ambystech.Elaris.UI.CodeEditor.Plugins/Ambystech.Elaris.UI.CodeEditor.Plugins.csproj --configuration Release --no-restore

    - name: Pack
      run: dotnet pack packages/plugins/Ambystech.Elaris.UI.CodeEditor.Plugins/Ambystech.Elaris.UI.CodeEditor.Plugins.csproj --configuration Release --no-build --output ./artifacts

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: nuget-package-plugins
        path: ./artifacts/*.nupkg

  publish:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: "!contains(github.event.head_commit.modified, '.github/workflows/')"
    permissions:
      contents: write   # push the tag and create the GitHub release
      id-token: write   # request the OIDC token used for NuGet trusted publishing

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        name: nuget-package-plugins
        path: ./artifacts

    # NuGet trusted publishing: exchange the workflow's OIDC token for an API key that is valid
    # for one hour. Needs a trusted publishing policy on nuget.org for this repository and
    # workflow file, and the NUGET_USER secret (the nuget.org profile name, not the email).
    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    # Publish first: if the push fails, no tag or release is created, so the workflow can
    # simply be re-run after fixing the problem.
    - name: Publish to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Create Git Tag
      run: |
        TAG="plugins-v${{ needs.build-and-test.outputs.version }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
          echo "Tag $TAG already exists; skipping."
        else
          git tag -a "$TAG" -m "Release Plugins v${{ needs.build-and-test.outputs.version }}"
          git push origin "$TAG"
        fi

    - name: Generate Release Notes
      run: |
        VERSION="${{ needs.build-and-test.outputs.version }}"
        # Use the CHANGELOG section for this version ("## [x.y.z]" up to the next "## ["), if any.
        awk -v v="$VERSION" '
          $0 ~ "^## \\[" v "\\]" { found = 1; next }
          found && /^## \[/ { exit }
          found { print }
        ' CHANGELOG.md > section.md || true
        {
          if [ -s section.md ]; then
            cat section.md
          else
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match "plugins-v*" HEAD^ 2>/dev/null || echo "")
            echo "## Changes in this Release"
            echo
            if [ -z "$PREVIOUS_TAG" ]; then
              git log --pretty=format:"- %s (%h)" --no-merges
            else
              git log "$PREVIOUS_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges
            fi
            echo
          fi
          echo
          echo "## NuGet Package"
          echo
          echo '```'
          echo "dotnet add package Ambystech.Elaris.UI.CodeEditor.Plugins --version ${{ needs.build-and-test.outputs.nuget_version }}"
          echo '```'
        } > release-notes.md
        cat release-notes.md

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="plugins-v${{ needs.build-and-test.outputs.version }}"
        PRERELEASE=""
        if [ "${{ needs.build-and-test.outputs.is_prerelease }}" = "true" ]; then PRERELEASE="--prerelease"; fi
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" ./artifacts/*.nupkg --clobber
        else
          gh release create "$TAG" ./artifacts/*.nupkg --title "Release Plugins v${{ needs.build-and-test.outputs.version }}" --notes-file release-notes.md $PRERELEASE
        fi
